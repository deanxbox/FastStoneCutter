plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        faststonecutter {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def modVersion = project.version

processResources {
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
}

def archiveName = base.archivesName.get()

jar {
    inputs.property 'archiveName', archiveName

    from('LICENSE') {
        rename { "${it}_${archiveName}" }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "faststonecutter"
    versionNumber = project.mod_version
    versionType = "release"
    uploadFile = tasks.named("jar")
    gameVersions = ["1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"]
    loaders = ["fabric"]
    changelog = file("CHANGELOG.md").exists() ? file("CHANGELOG.md").text : ""
}
